[project]
name = "planlabel"
version = "0.1.0"
description = "Rotulador de planning applications irlandesas (energia / não energia) para treino de IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "deep-translator>=1.11",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "playwright>=1.47",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["planlabel*"]

[tool.setuptools.package-data]
planlabel = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: testes contra as fontes e modelos reais (rede e chaves); fora da suíte padrão",
    "e2e: testes de navegador com Playwright",
]

[tool.coverage.run]
source = ["planlabel"]
omit = ["planlabel/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
